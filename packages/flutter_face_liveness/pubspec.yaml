name: flutter_face_liveness
description: >-
  Production-ready Flutter SDK for face detection, liveness verification, and anti-spoof protection using ML Kit, TensorFlow Lite, and optional YOLOv8n-face / SCRFD-2.5G-KPS backends.
# Local copy of flutter_face_liveness 3.6.0 with two patches:
# - the 3.7.1 fix for onSuccess never firing when enableBestFrontalCapture is
#   true (3.7.1 itself needs Dart 3.12+);
# - frame_encoder.dart: Android best-frontal capture was rotated upside down
#   (still present in 3.7.1).
version: 3.6.0+chatapp.2
homepage: https://github.com/sanjaysharmajw/flutter_face_liveness
repository: https://github.com/sanjaysharmajw/flutter_face_liveness
issue_tracker: https://github.com/sanjaysharmajw/flutter_face_liveness/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.14.0
  google_mlkit_face_mesh_detection: ^0.5.0
  camera: ^0.12.0+1
  provider: ^6.1.5+1
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  path_provider: ^2.1.5
  image: ^4.1.7

flutter:
  plugin:
    platforms:
      android:
        package: com.cerisetechsolutions.flutter_face_liveness
        pluginClass: FlutterFaceLivenessPlugin
      ios:
        pluginClass: FlutterFaceLivenessPlugin

  # No bundled model — downloaded automatically on first enableFaceId use
